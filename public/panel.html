<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pannello Regia</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #121212; color: #fff; padding: 20px; margin: 0; }
        .card { background: #222; border-radius: 8px; padding: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); margin-bottom: 20px;}
        .flex-container { display: flex; gap: 20px; flex-wrap: wrap; }
        .flex-container > .card { flex: 1; min-width: 300px; }
        h3 { margin-top: 0; border-bottom: 1px solid #444; padding-bottom: 10px; color: #fff; }
        .form-group { margin-bottom: 10px; }
        label { display: block; font-size: 12px; color: #aaa; margin-bottom: 5px; text-transform: uppercase; }
        input[type="text"], input[type="number"], select, input[type="file"] { width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #444; background: #333; color: white; box-sizing: border-box; }
        input[type="color"] { width: 100%; height: 35px; border: none; padding: 0; cursor: pointer; }
        .color-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .btn-row { display: flex; gap: 10px; margin-top: 5px; }
        button { flex: 1; padding: 10px; font-weight: bold; border: none; border-radius: 4px; cursor: pointer; color: white; transition: opacity 0.2s; }
        button:active { opacity: 0.8; }
        .btn-minus { background: #dc3545; }
        .btn-plus { background: #28a745; }
        .event-btn { padding: 8px; font-size: 13px; border-radius: 4px; font-weight: bold; border: none; cursor: pointer; color: white; width: 100%;}
    </style>
</head>
<body>
    <div style="max-width: 900px; margin: 0 auto;">
        <h2 style="text-align: center; color: #00ff88;">⚽ PANNELLO REGIA</h2>

        <div class="flex-container">
            <!-- SQUADRA CASA -->
            <div class="card">
                <h3>🏠 CASA (Sinistra)</h3>
                <div class="form-group"><label>Nome Abbreviato</label><input type="text" id="short1" value="LIV" maxlength="3" oninput="sendData()"></div>
                <div class="form-group"><label>Strisce Accento (2 Colori)</label>
                    <div class="color-grid"><input type="color" id="acc1a" value="#e31b23" onchange="sendData()"><input type="color" id="acc1b" value="#ffffff" onchange="sendData()"></div>
                </div>
                <div class="form-group"><label>Logo PNG</label><input type="file" accept="image/*" onchange="uploadLogo(1, this)"></div>
                
                <div class="form-group" style="border-top: 1px solid #444; padding-top: 10px; margin-top: 15px;">
                    <label style="color:#00ff88;">⚽ Gestione Reti</label>
                    <div class="btn-row">
                        <button class="btn-minus" onclick="updateScore(1,-1)">- 1 GOL</button>
                        <button class="btn-plus" onclick="updateScore(1,1)">+ 1 GOL</button>
                    </div>
                </div>

                <div class="form-group" style="border-top: 1px solid #444; padding-top: 10px; margin-top: 10px;">
                    <label style="color:#00ff88;">⚠️ Eventi Speciali</label>
                    <div class="btn-row">
                        <button class="event-btn" style="background:#ffc107; color:#000;" onclick="fireMatchEvent(1, 'YELLOW')">🟨 Giallo</button>
                        <button class="event-btn" style="background:#dc3545;" onclick="addRedCard(1)">🟥 Rosso</button>
                        <button class="event-btn" style="background:#17a2b8;" onclick="fireMatchEvent(1, 'SUB')">🔄 Cambio</button>
                    </div>
                    <button class="event-btn" style="background: transparent; border: 1px dashed #666; margin-top: 5px;" onclick="removeRedCard(1)">Togli Cartellino Rosso</button>
                </div>
            </div>

            <!-- SQUADRA OSPITI -->
            <div class="card">
                <h3>✈️ OSPITI (Destra)</h3>
                <div class="form-group"><label>Nome Abbreviato</label><input type="text" id="short2" value="WOL" maxlength="3" oninput="sendData()"></div>
                <div class="form-group"><label>Strisce Accento (2 Colori)</label>
                    <div class="color-grid"><input type="color" id="acc2a" value="#fdb913" onchange="sendData()"><input type="color" id="acc2b" value="#231f20" onchange="sendData()"></div>
                </div>
                <div class="form-group"><label>Logo PNG</label><input type="file" accept="image/*" onchange="uploadLogo(2, this)"></div>
                
                <div class="form-group" style="border-top: 1px solid #444; padding-top: 10px; margin-top: 15px;">
                    <label style="color:#00ff88;">⚽ Gestione Reti</label>
                    <div class="btn-row">
                        <button class="btn-minus" onclick="updateScore(2,-1)">- 1 GOL</button>
                        <button class="btn-plus" onclick="updateScore(2,1)">+ 1 GOL</button>
                    </div>
                </div>

                <div class="form-group" style="border-top: 1px solid #444; padding-top: 10px; margin-top: 10px;">
                    <label style="color:#00ff88;">⚠️ Eventi Speciali</label>
                    <div class="btn-row">
                        <button class="event-btn" style="background:#ffc107; color:#000;" onclick="fireMatchEvent(2, 'YELLOW')">🟨 Giallo</button>
                        <button class="event-btn" style="background:#dc3545;" onclick="addRedCard(2)">🟥 Rosso</button>
                        <button class="event-btn" style="background:#17a2b8;" onclick="fireMatchEvent(2, 'SUB')">🔄 Cambio</button>
                    </div>
                    <button class="event-btn" style="background: transparent; border: 1px dashed #666; margin-top: 5px;" onclick="removeRedCard(2)">Togli Cartellino Rosso</button>
                </div>
            </div>
        </div>

        <div class="card" style="margin-top:20px;">
            <h3>🎨 COLORI RETTANGOLI SCOREBOARD</h3>
            <div class="color-grid" style="grid-template-columns: repeat(4, 1fr);">
                <div><label>Sfondo Nomi</label><input type="color" id="colorNames" value="#ffffff" onchange="sendData()"></div>
                <div><label>Sfondo Punti</label><input type="color" id="colorScore" value="#00ff88" onchange="sendData()"></div>
                <div><label>Sfondo Timer</label><input type="color" id="colorTimerBg" value="#ffffff" onchange="sendData()"></div>
                <div><label>Testo Timer (Nero)</label><input type="color" id="colorTimerText" value="#000000" onchange="sendData()"></div>
            </div>
        </div>

        <div class="card timer-ctrl" style="margin-top:20px; text-align: left; background: #1a1a1a;">
            <h3 style="text-align: center;">⏱️ GESTIONE CRONOMETRO E FASI</h3>
            
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 15px;">
                <div>
                    <label style="color:#00ff88; margin-bottom: 5px;">Fase della Partita</label>
                    <select id="targetTime" onchange="sendData()" style="font-weight: bold;">
                        <option value="45">Primo Tempo (Stop a 45')</option>
                        <option value="90">Secondo Tempo (Stop a 90')</option>
                        <option value="105">1° Supplementare (Stop a 105')</option>
                        <option value="120">2° Supplementare (Stop a 120')</option>
                    </select>
                </div>

                <div>
                    <label style="color:#00ff88; margin-bottom: 5px;">Imposta Minuto Manuale</label>
                    <div style="display: flex; gap: 5px;">
                        <input type="number" id="manualMinute" value="45" style="width: 80px; text-align: center;">
                        <button onclick="socket.emit('setTime', document.getElementById('manualMinute').value)" style="background: #17a2b8; padding: 10px;">IMPOSTA</button>
                    </div>
                </div>
            </div>

            <div class="btn-row">
                <button onclick="socket.emit('startTimer')" style="background:#28a745; font-size:16px;">▶ AVVIA</button>
                <button onclick="socket.emit('pauseTimer')" style="background:#ffc107; color:black; font-size:16px;">⏸ PAUSA</button>
                <button onclick="socket.emit('resetTimer')" style="background:#dc3545; font-size:16px;">⏹ RESET</button>
            </div>
        </div>

        <!-- SEZIONE SPONSOR E FULLSCREEN -->
        <div class="card" style="margin-top:20px; background: #1a1a1a;">
            <h3 style="text-align: center;">📢 EXTRA E GRAFICHE MATCH</h3>
            
            <div style="margin-bottom: 15px;">
                <label style="color:#e67e22; margin-bottom: 5px; display: block; text-align: center;">Richiede l'immagine "sponsors.png" nella cartella public</label>
                <button onclick="socket.emit('triggerSponsor')" style="background:#e67e22; padding:12px; font-size:16px; width: 100%;">💸 MOSTRA SPONSOR (20 sec)</button>
            </div>

            <div style="border-top: 1px solid #444; padding-top: 15px;">
                <label style="color:#00ff88; margin-bottom: 5px; display: block;">Immagine Fullscreen (Seleziona da telefono/PC)</label>
                <div style="display: flex; gap: 10px;">
                    <input type="file" accept="image/*" id="fullscreenInput" style="flex: 2;">
                    <button onclick="processFullscreen()" style="background:#2980b9; flex: 1;">CARICA</button>
                </div>
                <button id="btn-fullscreen" onclick="toggleFullscreen()" style="background:#e74c3c; width: 100%; margin-top: 10px; font-size: 16px; display: none;">🖼️ MOSTRA A TUTTO SCHERMO</button>
            </div>
        </div>

    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let logo1 = "", logo2 = "";
        let isFullscreenActive = false;
        
        let data = {
            short1: "LIV", score1: 0, acc1a: "#e31b23", acc1b: "#ffffff", logo1: "", red1: 0,
            short2: "WOL", score2: 0, acc2a: "#fdb913", acc2b: "#231f20", logo2: "", red2: 0,
            colorNames: "#ffffff", colorScore: "#00ff88", colorTimerBg: "#ffffff", colorTimerText: "#000000",
            targetTime: "45", lastEvent: null
        };

        socket.on('updateData', (serverData) => {
            data = serverData;
            document.getElementById('short1').value = data.short1;
            document.getElementById('acc1a').value = data.acc1a;
            document.getElementById('acc1b').value = data.acc1b;
            document.getElementById('short2').value = data.short2;
            document.getElementById('acc2a').value = data.acc2a;
            document.getElementById('acc2b').value = data.acc2b;
            document.getElementById('colorNames').value = data.colorNames;
            document.getElementById('colorScore').value = data.scoreBoxBg || data.colorScore;
            document.getElementById('colorTimerBg').value = data.colorTimerBg;
            document.getElementById('colorTimerText').value = data.colorTimerText;
            document.getElementById('targetTime').value = data.targetTime;
        });

        function compressImage(file, isLogo, callback) {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const maxW = isLogo ? 200 : 1280;
                    const maxH = isLogo ? 200 : 720;
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > maxW) { height *= maxW / width; width = maxW; }
                    } else {
                        if (height > maxH) { width *= maxH / height; height = maxH; }
                    }
                    
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    
                    // 🛠️ PULIZIA FORZATA: Cancella qualsiasi residuo di colore nello sfondo rendendolo 100% trasparente
                    ctx.clearRect(0, 0, width, height);
                    
                    ctx.drawImage(img, 0, 0, width, height);

                    // Restituisce sempre in formato PNG per preservare la trasparenza perfetta dei loghi
                    callback(canvas.toDataURL('image/png'));
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function uploadLogo(team, input) {
            if(input.files[0]) {
                compressImage(input.files[0], true, (compressed) => {
                    if(team === 1) logo1 = compressed; else logo2 = compressed;
                    sendData();
                });
            }
        }

        // CARICAMENTO DEDICATO E DIRETTO SUL CANALE FULLSCREEN
        function processFullscreen() {
            const input = document.getElementById('fullscreenInput');
            if(input.files[0]) {
                alert("Elaborazione e compressione immagine in corso... Un attimo di pazienza.");
                compressImage(input.files[0], false, (compressed) => {
                    // Spedisce l'immagine direttamente tramite il canale dedicato
                    socket.emit('setFullscreenImage', compressed);
                    document.getElementById('btn-fullscreen').style.display = 'block'; 
                    alert("Immagine caricata con successo e pronta per andare in onda!");
                });
            } else {
                alert("Seleziona prima un'immagine dal telefono!");
            }
        }

        function updateScore(t, v) {
            if(t===1) data.score1 = Math.max(0, data.score1 + v);
            else data.score2 = Math.max(0, data.score2 + v);
            sendData();
        }

        function addRedCard(team) {
            if(team === 1) data.red1++; else data.red2++;
            fireMatchEvent(team, 'RED');
        }
        
        function removeRedCard(team) {
            if(team === 1) data.red1 = Math.max(0, data.red1 - 1); else data.red2 = Math.max(0, data.red2 - 1);
            sendData();
        }

        function fireMatchEvent(team, type) {
            data.lastEvent = { type: type, team: team, id: Date.now() };
            sendData();
        }

        function toggleFullscreen() {
            isFullscreenActive = !isFullscreenActive;
            const btn = document.getElementById('btn-fullscreen');
            
            if (isFullscreenActive) {
                btn.innerText = "❌ NASCONDI";
                btn.style.background = "#27ae60";
            } else {
                btn.innerText = "🖼️ MOSTRA A TUTTO SCHERMO";
                btn.style.background = "#e74c3c";
            }
            socket.emit('toggleFullscreen', isFullscreenActive);
        }

        function sendData() {
            data.short1 = document.getElementById('short1').value.toUpperCase(); 
            data.acc1a = document.getElementById('acc1a').value; 
            data.acc1b = document.getElementById('acc1b').value; 
            if(logo1) data.logo1 = logo1;
            
            data.short2 = document.getElementById('short2').value.toUpperCase(); 
            data.acc2a = document.getElementById('acc2a').value; 
            data.acc2b = document.getElementById('acc2b').value; 
            if(logo2) data.logo2 = logo2;
            
            data.colorNames = document.getElementById('colorNames').value; 
            data.colorScore = document.getElementById('colorScore').value; 
            data.colorTimerBg = document.getElementById('colorTimerBg').value; 
            data.colorTimerText = document.getElementById('colorTimerText').value;
            data.targetTime = document.getElementById('targetTime').value;
            
            socket.emit('updateScoreboard', data);
        }
    </script>
</body>
</html>
