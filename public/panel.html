<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Regia Scoreboard - Premier Edition</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0f0f0f; color: white; padding: 20px; }
        .container { max-width: 1000px; margin: auto; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .card { background: #1a1a1a; padding: 20px; border-radius: 8px; border: 1px solid #333; }
        h3 { color: #00ff88; margin-top: 0; font-size: 14px; text-transform: uppercase; }
        .form-group { margin-bottom: 10px; }
        label { display: block; font-size: 11px; color: #888; margin-bottom: 4px; }
        input[type="text"], input[type="file"] { width: 100%; padding: 8px; background: #222; border: 1px solid #444; color: white; border-radius: 4px; box-sizing: border-box; }
        .color-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        input[type="color"] { width: 100%; height: 35px; border: none; cursor: pointer; background: none; }
        .btn-row { display: flex; gap: 5px; margin-top: 10px; }
        button { flex: 1; padding: 10px; font-weight: bold; cursor: pointer; border: none; border-radius: 4px; color: white; text-transform: uppercase; font-size: 12px; }
        .btn-plus { background: #28a745; } .btn-minus { background: #555; }
        .timer-ctrl { background: #444; padding: 15px; text-align: center; margin-top: 20px; border-radius: 8px; }
        .event-btn { padding: 8px; font-size: 11px; }
    </style>
</head>
<body>
    <div class="container">
        <h2 style="text-align: center; letter-spacing: 2px;">PREMIER LEAGUE STYLE CONTROL</h2>
        
        <div class="grid">
            <div class="card">
                <h3>🏠 CASA (Sinistra)</h3>
                <div class="form-group"><label>Nome Abbreviato</label><input type="text" id="short1" value="LIV" maxlength="3" oninput="sendData()"></div>
                <div class="form-group"><label>Strisce Accento (2 Colori)</label>
                    <div class="color-grid"><input type="color" id="acc1a" value="#e31b23" onchange="sendData()"><input type="color" id="acc1b" value="#ffffff" onchange="sendData()"></div>
                </div>
                <div class="form-group"><label>Logo PNG Trasparente</label><input type="file" onchange="uploadLogo(1, this)"></div>
                
                <div class="form-group" style="border-top: 1px solid #444; padding-top: 10px; margin-top: 15px;">
                    <label style="color:#00ff88;">⚽ Gestione Reti</label>
                    <div class="btn-row">
                        <button class="btn-minus" onclick="updateScore(1,-1)">- 1 GOL</button>
                        <button class="btn-plus" onclick="updateScore(1,1)">+ 1 GOL</button>
                    </div>
                </div>

                <div class="form-group" style="border-top: 1px solid #444; padding-top: 10px; margin-top: 10px;">
                    <label style="color:#00ff88;">⚠️ Eventi Speciali</label>
                    <div class="btn-row">
                        <button class="event-btn" style="background:#ffc107; color:#000;" onclick="fireMatchEvent(1, 'YELLOW')">🟨 Giallo</button>
                        <button class="event-btn" style="background:#dc3545;" onclick="addRedCard(1)">🟥 Rosso</button>
                        <button class="event-btn" style="background:#17a2b8;" onclick="fireMatchEvent(1, 'SUB')">🔄 Cambio</button>
                    </div>
                    <button class="event-btn" style="background: transparent; border: 1px dashed #666; width: 100%; margin-top: 5px;" onclick="removeRedCard(1)">Togli Cartellino Rosso</button>
                </div>
            </div>

            <div class="card">
                <h3>✈️ OSPITI (Destra)</h3>
                <div class="form-group"><label>Nome Abbreviato</label><input type="text" id="short2" value="WOL" maxlength="3" oninput="sendData()"></div>
                <div class="form-group"><label>Strisce Accento (2 Colori)</label>
                    <div class="color-grid"><input type="color" id="acc2a" value="#fdb913" onchange="sendData()"><input type="color" id="acc2b" value="#231f20" onchange="sendData()"></div>
                </div>
                <div class="form-group"><label>Logo PNG Trasparente</label><input type="file" onchange="uploadLogo(2, this)"></div>
                
                <div class="form-group" style="border-top: 1px solid #444; padding-top: 10px; margin-top: 15px;">
                    <label style="color:#00ff88;">⚽ Gestione Reti</label>
                    <div class="btn-row">
                        <button class="btn-minus" onclick="updateScore(2,-1)">- 1 GOL</button>
                        <button class="btn-plus" onclick="updateScore(2,1)">+ 1 GOL</button>
                    </div>
                </div>

                <div class="form-group" style="border-top: 1px solid #444; padding-top: 10px; margin-top: 10px;">
                    <label style="color:#00ff88;">⚠️ Eventi Speciali</label>
                    <div class="btn-row">
                        <button class="event-btn" style="background:#ffc107; color:#000;" onclick="fireMatchEvent(2, 'YELLOW')">🟨 Giallo</button>
                        <button class="event-btn" style="background:#dc3545;" onclick="addRedCard(2)">🟥 Rosso</button>
                        <button class="event-btn" style="background:#17a2b8;" onclick="fireMatchEvent(2, 'SUB')">🔄 Cambio</button>
                    </div>
                    <button class="event-btn" style="background: transparent; border: 1px dashed #666; width: 100%; margin-top: 5px;" onclick="removeRedCard(2)">Togli Cartellino Rosso</button>
                </div>
            </div>
        </div>

        <div class="card" style="margin-top:20px;">
            <h3>🎨 COLORI RETTANGOLI SCOREBOARD</h3>
            <div class="color-grid" style="grid-template-columns: repeat(4, 1fr);">
                <div><label>Sfondo Nomi</label><input type="color" id="colorNames" value="#3d195b" onchange="sendData()"></div>
                <div><label>Sfondo Punti</label><input type="color" id="colorScore" value="#00ff88" onchange="sendData()"></div>
                <div><label>Sfondo Timer</label><input type="color" id="colorTimerBg" value="#ffffff" onchange="sendData()"></div>
                <div><label>Testo Timer</label><input type="color" id="colorTimerText" value="#3d195b" onchange="sendData()"></div>
            </div>
        </div>

        <div class="card timer-ctrl" style="margin-top:20px; text-align: left; background: #1a1a1a;">
            <h3 style="text-align: center;">⏱️ GESTIONE CRONOMETRO E FASI</h3>
            
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 15px;">
                <div>
                    <label style="color:#00ff88; margin-bottom: 5px; display: block;">Fase della Partita (Allineamento automatico)</label>
                    <select id="targetTime" onchange="sendData()" style="width: 100%; padding: 10px; background: #222; color: white; border: 1px solid #444; border-radius: 4px; font-weight: bold;">
                        <option value="45">Primo Tempo (Stop a 45')</option>
                        <option value="90">Secondo Tempo (Stop a 90')</option>
                        <option value="105">1° Supplementare (Stop a 105')</option>
                        <option value="120">2° Supplementare (Stop a 120')</option>
                    </select>
                </div>

                <div>
                    <label style="color:#00ff88; margin-bottom: 5px; display: block;">Imposta Minuto Manuale</label>
                    <div style="display: flex; gap: 5px;">
                        <input type="number" id="manualMinute" value="45" style="width: 80px; text-align: center; background:#222; color:white; border:1px solid #444; border-radius:4px;">
                        <button onclick="socket.emit('setTime', document.getElementById('manualMinute').value)" style="background: #17a2b8; padding: 10px; font-size: 14px;">IMPOSTA</button>
                    </div>
                </div>
            </div>

            <div class="btn-row">
                <button onclick="socket.emit('startTimer')" style="background:#28a745; font-size:16px;">▶ AVVIA</button>
                <button onclick="socket.emit('pauseTimer')" style="background:#ffc107; color:black; font-size:16px;">⏸ PAUSA</button>
                <button onclick="socket.emit('resetTimer')" style="background:#dc3545; font-size:16px;">⏹ RESET</button>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let logo1 = "", logo2 = "";
        
        let data = {
            short1: "LIV", score1: 0, acc1a: "#e31b23", acc1b: "#ffffff", logo1: "", red1: 0,
            short2: "WOL", score2: 0, acc2a: "#fdb913", acc2b: "#231f20", logo2: "", red2: 0,
            colorNames: "#3d195b", colorScore: "#00ff88", colorTimerBg: "#ffffff", colorTimerText: "#3d195b",
            targetTime: "45", lastEvent: null
        };

        socket.on('updateData', (serverData) => {
            data = serverData;
            document.getElementById('short1').value = data.short1;
            document.getElementById('acc1a').value = data.acc1a;
            document.getElementById('acc1b').value = data.acc1b;
            document.getElementById('short2').value = data.short2;
            document.getElementById('acc2a').value = data.acc2a;
            document.getElementById('acc2b').value = data.acc2b;
            document.getElementById('colorNames').value = data.colorNames;
            document.getElementById('colorScore').value = data.scoreBoxBg || data.colorScore;
            document.getElementById('colorTimerBg').value = data.colorTimerBg;
            document.getElementById('colorTimerText').value = data.colorTimerText;
            document.getElementById('targetTime').value = data.targetTime;
        });

        function uploadLogo(team, input) {
            const reader = new FileReader();
            reader.onload = (e) => {
                if(team === 1) logo1 = e.target.result; else logo2 = e.target.result;
                sendData();
            };
            if(input.files[0]) reader.readAsDataURL(input.files[0]);
        }

        function updateScore(t, v) {
            if(t===1) data.score1 = Math.max(0, data.score1 + v);
            else data.score2 = Math.max(0, data.score2 + v);
            sendData();
        }

        function addRedCard(team) {
            if(team === 1) data.red1++; else data.red2++;
            fireMatchEvent(team, 'RED');
        }
        
        function removeRedCard(team) {
            if(team === 1) data.red1 = Math.max(0, data.red1 - 1); else data.red2 = Math.max(0, data.red2 - 1);
            sendData();
        }

        function fireMatchEvent(team, type) {
            data.lastEvent = { type: type, team: team, id: Date.now() };
            sendData();
        }

        function sendData() {
            data.short1 = document.getElementById('short1').value.toUpperCase(); 
            data.acc1a = document.getElementById('acc1a').value; 
            data.acc1b = document.getElementById('acc1b').value; 
            if(logo1) data.logo1 = logo1;
            
            data.short2 = document.getElementById('short2').value.toUpperCase(); 
            data.acc2a = document.getElementById('acc2a').value; 
            data.acc2b = document.getElementById('acc2b').value; 
            if(logo2) data.logo2 = logo2;
            
            data.colorNames = document.getElementById('colorNames').value; 
            data.colorScore = document.getElementById('colorScore').value; 
            data.colorTimerBg = document.getElementById('colorTimerBg').value; 
            data.colorTimerText = document.getElementById('colorTimerText').value;
            data.targetTime = document.getElementById('targetTime').value;
            
            socket.emit('updateScoreboard', data);
        }
    </script>
</body>
</html>
